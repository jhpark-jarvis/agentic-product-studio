<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Product Studio Architecture Overview</title>
  <desc id="desc">Human users and AI agents share a React and FastAPI workspace backed by interchangeable data and storage providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7f5"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173b63"/><stop offset="1" stop-color="#0d2744"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173b63" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#4b6b86"/></marker>
    <style>
      .title{font:700 38px 'Segoe UI',sans-serif;fill:#102b49}.sub{font:400 17px 'Segoe UI',sans-serif;fill:#59718a}
      .section{font:700 14px 'Segoe UI',sans-serif;letter-spacing:2px}.heading{font:700 21px 'Segoe UI',sans-serif;fill:#102b49}
      .body{font:400 15px 'Segoe UI',sans-serif;fill:#526b83}.small{font:600 14px 'Segoe UI',sans-serif;fill:#59718a}
      .white{font:700 23px 'Segoe UI',sans-serif;fill:#fff}.whitebody{font:400 15px 'Segoe UI',sans-serif;fill:#dcecf7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="190" fill="#d9f0ec" opacity=".55"/><circle cx="60" cy="850" r="160" fill="#e3edfb" opacity=".6"/>
  <text x="800" y="70" text-anchor="middle" class="title">Agentic Product Studio Architecture</text>
  <text x="800" y="103" text-anchor="middle" class="sub">A shared product workspace for people and AI agents</text>

  <text x="70" y="165" class="section" fill="#2377c9">COLLABORATORS</text><line x1="70" y1="179" x2="350" y2="179" stroke="#2377c9" stroke-width="2"/>
  <text x="480" y="165" class="section" fill="#078b88">INTERFACE</text><line x1="480" y1="179" x2="720" y2="179" stroke="#078b88" stroke-width="2"/>
  <text x="820" y="165" class="section" fill="#d77b20">APPLICATION RUNTIME</text><line x1="820" y1="179" x2="1250" y2="179" stroke="#d77b20" stroke-width="2"/>
  <text x="1320" y="165" class="section" fill="#078b88">DATA &amp; STORAGE</text><line x1="1320" y1="179" x2="1530" y2="179" stroke="#078b88" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="65" y="235" width="285" height="125" rx="18" fill="#fff" stroke="#75a9e5" stroke-width="2"/>
    <circle cx="115" cy="297" r="27" fill="#2377c9"/><circle cx="115" cy="289" r="9" fill="#fff"/><path d="M98 319Q115 297 132 319" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="160" y="295" class="heading">Human team</text><text x="160" y="322" class="body">Planning and operations</text>
    <rect x="65" y="430" width="285" height="125" rx="18" fill="#fff" stroke="#5dbab5" stroke-width="2"/>
    <circle cx="115" cy="492" r="27" fill="#078b88"/><rect x="100" y="478" width="30" height="25" rx="6" fill="none" stroke="#fff" stroke-width="4"/><circle cx="108" cy="490" r="3" fill="#fff"/><circle cx="122" cy="490" r="3" fill="#fff"/>
    <text x="160" y="490" class="heading">AI agent</text><text x="160" y="517" class="body">Persistent docs and API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="235" width="275" height="320" rx="22" fill="#fff" stroke="#5dbab5" stroke-width="2"/>
    <text x="592" y="278" text-anchor="middle" class="heading">Shared workspace</text><text x="592" y="305" text-anchor="middle" class="body">One product context</text>
    <rect x="495" y="345" width="195" height="72" rx="12" fill="#e8f7f5"/><text x="592" y="376" text-anchor="middle" class="heading" font-size="17">React UI</text><text x="592" y="399" text-anchor="middle" class="body" font-size="14">browser workflow</text>
    <rect x="495" y="445" width="195" height="72" rx="12" fill="#e8f7f5"/><text x="592" y="476" text-anchor="middle" class="heading" font-size="17">Project docs</text><text x="592" y="499" text-anchor="middle" class="body" font-size="14">recoverable context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="210" width="440" height="445" rx="24" fill="url(#runtime)"/>
    <text x="845" y="255" class="white">Portable application host</text><text x="845" y="283" class="whitebody">Local runtime or container deployment</text>
    <rect x="845" y="315" width="370" height="78" rx="14" fill="#234e76"/><text x="870" y="347" class="white" font-size="19">FastAPI service</text><text x="870" y="374" class="whitebody">HTTP API and SPA delivery</text>
    <rect x="845" y="415" width="370" height="175" rx="14" fill="#fff"/><text x="870" y="450" class="heading">Provider boundary</text><text x="870" y="478" class="body">Repository and storage contracts</text><text x="870" y="516" class="small">Documents, WBS and schedules</text><text x="870" y="544" class="small">Members, assets and catalog</text><text x="870" y="572" class="small">Markdown and image pipeline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1320" y="215" width="245" height="115" rx="18" fill="#fff" stroke="#5dbab5" stroke-width="2"/><circle cx="1365" cy="272" r="25" fill="#078b88"/><ellipse cx="1365" cy="263" rx="14" ry="6" fill="#fff"/><path d="M1351 263V284Q1365 294 1379 284V263" fill="none" stroke="#fff" stroke-width="3"/><text x="1405" y="270" class="heading" font-size="17">SQLite / D1</text><text x="1405" y="295" class="body" font-size="14">data providers</text>
    <rect x="1320" y="380" width="245" height="115" rx="18" fill="#fff" stroke="#5dbab5" stroke-width="2"/><circle cx="1365" cy="437" r="25" fill="#078b88"/><path d="M1353 444Q1361 425 1369 439Q1378 421 1381 450H1350Z" fill="#fff"/><text x="1405" y="435" class="heading" font-size="17">Local / R2</text><text x="1405" y="460" class="body" font-size="14">file providers</text>
    <rect x="1320" y="545" width="245" height="115" rx="18" fill="#fff" stroke="#e09b4c" stroke-width="2"/><rect x="1348" y="592" width="35" height="27" rx="4" fill="#d77b20"/><path d="M1348 592H1361L1367 598H1383V619H1348Z" fill="#f2c37d"/><text x="1405" y="600" class="heading" font-size="17">Git documents</text><text x="1405" y="625" class="body" font-size="14">persistent decisions</text>
  </g>

  <path d="M350 297H450M350 492H450M730 395H800M1260 272H1310M1260 437H1310M1260 602H1310" fill="none" stroke="#4b6b86" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="65" y="750" width="1500" height="105" rx="20" fill="#fff" stroke="#c7d8e8" stroke-width="2"/>
  <text x="105" y="790" class="section" fill="#59718a">DESIGN PRINCIPLES</text><text x="105" y="823" class="body">Shared human-agent context</text><text x="470" y="823" class="body">Replaceable providers</text><text x="835" y="823" class="body">Portable runtime</text><text x="1160" y="823" class="body">Decisions persisted in Git</text>
  <line x1="425" y1="780" x2="425" y2="835" stroke="#d7e2ec"/><line x1="790" y1="780" x2="790" y2="835" stroke="#d7e2ec"/><line x1="1115" y1="780" x2="1115" y2="835" stroke="#d7e2ec"/>
</svg>
